services:
  whatidid:
    build:
      context: .
      dockerfile: Dockerfile
    image: whatidid-local:latest
    container_name: whatidid-local
    environment:
      # Legacy token path.
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      # Recommended custom endpoint path (Azure Foundry / Azure OpenAI compatible).
      - WHATIDID_API_URL=${WHATIDID_API_URL:-}
      - WHATIDID_MODEL=${WHATIDID_MODEL:-gpt-5.4}
      - WHATIDID_API_KEY=${WHATIDID_API_KEY:-}
      - WHATIDID_API_AUTH=${WHATIDID_API_AUTH:-auto}
      - WHATIDID_API_VERSION=${WHATIDID_API_VERSION:-}
      - WHATIDID_API_PROVIDER=${WHATIDID_API_PROVIDER:-azure}
      # Optional tuning knob for day-level concurrency.
      - WHATIDID_ANALYZE_WORKERS=${WHATIDID_ANALYZE_WORKERS:-5}
    volumes:
      # Persist analysis cache so runs do not reprocess unchanged dates.
      - ./cache:/app/cache
      # Persist generated HTML reports outside the container layer.
      - ./reports:/app/reports
      # Copilot CLI sessions from host.
      - ${HOME}/.copilot/session-state:/root/.copilot/session-state:ro
      # VS Code Copilot Chat sessions from host.
      # Container runs Linux and harvest.py reads ~/.config/Code/User there,
      # so map macOS Code/User into that Linux path.
      - ${HOME}/Library/Application Support/Code/User:/root/.config/Code/User:ro
    command: ["--7D", "--out-dir", "/app/reports"]
